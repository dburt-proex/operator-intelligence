version: '0.1'
system: Operator Intelligence
repository: dburt-proex/operator-intelligence
canonical_registry: dburt-proex/casa/governance/CONTROL-REGISTRY.yaml
canonical_registry_version: '0.1'
claim_boundary: no_certification_or_attestation_claim_without_independent_assurance
assessment_date: '2026-08-16'
states: [NOT_APPLICABLE, MISSING, PARTIAL, IMPLEMENTED, VERIFIED]
controls:
  GOV-001:
    status: IMPLEMENTED
    evidence: [README.md, standards, methodology, framework, templates]
    note: Explicit evidence, scoring, publication and implementation authorization gates are core to the methodology.
  RSK-001:
    status: PARTIAL
    evidence: [framework, scoring, standards, README.md]
    gap: Assessment risk logic exists, but a canonical organizational risk register/treatment/residual-risk process is not established.
  IAM-001:
    status: PARTIAL
    evidence: [README.md, templates, playbooks]
    gap: Authorization boundaries are documented for engagement actions; technical identity/access control and periodic access review are not evidenced.
  CHG-001:
    status: IMPLEMENTED
    evidence: [.github/workflows/diffwall.yml, .github/workflows/validate-registry-and-map.yml, .github/workflows/publish-v1-release.yml]
    note: Registry/map validation and governed publication/change workflows exist.
  LOG-001:
    status: IMPLEMENTED
    evidence: [assessment-evidence-graph/src/assessment_evidence_graph/ledger.py, templates, standards]
    note: DecisionLedger-style traceability and supersession are explicit system invariants.
  EVD-001:
    status: IMPLEMENTED
    evidence: [assessment-evidence-graph, standards, playbooks/evidence-validation-playbook.md, examples]
    note: Evidence admission, provenance, uncertainty and traceability are first-class controls.
  SEC-001:
    status: PARTIAL
    evidence: [standards, methodology, README.md]
    gap: Scope/privacy/safety boundaries exist, but repository-wide formal threat model and independent security assessment are not evidenced.
  INC-001:
    status: MISSING
    evidence: []
    gap: No formal incident-response lifecycle with containment, RCA, corrective action and retest.
  AI-001:
    status: PARTIAL
    evidence: [standards, scoring, framework, assessment-evidence-graph]
    gap: AI readiness/evaluation controls exist; full AI system inventory, lifecycle monitoring and decommissioning records are incomplete.
  DAT-001:
    status: PARTIAL
    evidence: [standards, templates, playbooks, README.md]
    gap: Client confidentiality/evidence rules exist, but canonical data classification, retention, deletion and exception handling are incomplete.
  SUP-001:
    status: MISSING
    evidence: []
    gap: No supplier/model-provider inventory and risk-review process.
  BCM-001:
    status: MISSING
    evidence: []
    gap: No documented backup/restore/RTO/RPO control set or tested recovery evidence.
  REV-001:
    status: PARTIAL
    evidence: [templates, playbooks/publication-quality-review.md, COMMERCIAL_V1_COMPLETION.md, .github/workflows/publish-v1-release.yml]
    gap: QC and release review exist; recurring management review/internal-audit cadence is not formalized.
remediation:
  p0: [INC-001, DAT-001, SUP-001, BCM-001, RSK-001]
  p1: [IAM-001, SEC-001, AI-001, REV-001]
  external_assurance_gate: blocked_until_p0_closed_or_formally_risk_accepted
