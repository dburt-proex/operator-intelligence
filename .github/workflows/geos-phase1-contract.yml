name: Leverage Engine Regression

on:
  pull_request:
    paths:
      - 'leverage-engine/**'
      - '.github/workflows/geos-phase1-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-leverage-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate repository JSON syntax
        run: |
          find leverage-engine/schemas leverage-engine/config leverage-engine/fixtures leverage-engine/receipts \
            -type f -name '*.json' -print0 | while IFS= read -r -d '' file; do
              python -m json.tool "$file" >/dev/null
            done

      - name: Install Leverage Engine locally
        run: python -m pip install -e ./leverage-engine

      - name: Validate execution receipt contract
        run: python -m unittest discover -s leverage-engine/tests -p 'test_execution_receipt.py' -v

      - name: Run Leverage Engine regression suite
        run: python -m unittest discover -s leverage-engine/tests -v
