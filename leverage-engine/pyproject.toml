[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-intelligence-leverage-engine"
version = "0.1.0"
description = "Deterministic advisory prioritization subsystem for Operator Intelligence"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
leverage-engine = "leverage_engine.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
