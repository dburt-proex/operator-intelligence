[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "operator-intelligence-assessment-evidence-graph"
version = "0.1.0"
description = "Governed assessment evidence graph and Shared Decision Ledger receipt producer"
requires-python = ">=3.11"
dependencies = ["pydantic==2.13.4"]

[project.scripts]
oi-assessment-evidence-graph = "assessment_evidence_graph.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
